server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files precompressed at build time; fall back to compressing on the
    # fly for anything without one. The wasm and the JS bundle shrink ~4x this way.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/javascript text/javascript application/wasm text/css
               application/json image/svg+xml font/ttf application/octet-stream;

    # The bundle and the wasm are content-addressed by the build, so cache them hard.
    location ~* \.(js|wasm|mjs|ttf|woff2?|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy every /api/* call to the sesterzo-backend container.
    # The trailing slash on proxy_pass strips the /api prefix so that
    # /api/auth -> http://sesterzo-backend:8080/auth
    location /api/ {
        proxy_pass http://sesterzo-backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve the statically built application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
